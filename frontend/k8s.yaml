apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  name: frontend
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
  - protocol: TCP
    name: http-frontend-80
    port: 80
    targetPort: 80
    nodePort: 30800
  type: NodePort
  externalName: frontend.kubelab.info
---
apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  creationTimestamp: null
  name: dito-frontend
  labels:
    app.kubernetes.io/version: "v1.0.0.$BUILD_NUMBER"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        
      maxUnavailable: 0
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: dito
        tier: frontend
    spec:
      containers:
      - image: DOCKER_HOST_NAME/dito-frontend:v1.0.0.$BUILD_NUMBER
        imagePullPolicy: Always
        name: dito-frontend
        ports:
        - containerPort: 3000
        resources: {}
      restartPolicy: Always
      imagePullSecrets:
        - name: registry-auth
status: {}