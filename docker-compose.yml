version: "3"

services:
  redis:
    image: redis
    restart: always
    ports:
      - 6379:6379
  backend:
    image: dito-backend
    restart: always
    build:
      context: ./backend/
      dockerfile: Dockerfile.dev
    environment: 
      ALLOWED_ORIGIN: "http://frontend:3000"
      REDIS_ADDR: "redis:6379"
    ports:
        - 8080:8080
    depends_on:
      - redis
    volumes:
      - "./backend:/go/src/dito/backend"
  frontend:
    image: dito-frontend
    restart: always
    build:
      context: ./frontend/
      dockerfile: Dockerfile.dev
    ports:
        - 3000:3000
    volumes:
      - "./frontend:/dito/frontend"
