version: "3"

services:
  redis:
    image: redis
    restart: always
    ports:
      - 6379:6379
  backend:
    image: dito-backend
    build:
      context: ./backend/
      dockerfile: Dockerfile.dev
    environment: 
      ALLOWED_ORIGIN: "http://frontend:3000"
      REDIS_ADDR: "redis:6379"
    ports:
        - 8080:8080
  frontend:
    image: dito-frontend
    build:
      context: ./frontend/
      dockerfile: Dockerfile.dev
    ports:
        - 3000:3000
