settings:
  legacy:
    force: false
    interval: 0s
schema:
- name: backend
  path: .
  commands:
    generate:         # go generate
      status: false
    install:          # go install
      status: false
    vet:              # go vet
      status: false
    test:             # go test
      status: false
    fmt:              # go fmt
      status: true
    build:            # go build
      status: true 
    run:              # go run
      status: true
  watcher:
    extensions:
    - go
    paths:
    - /
    ignored_paths:
    - .git
    - .realize
    - vendor
    scripts:
    - type: before
      command: go get -v -t ./...
      output: true