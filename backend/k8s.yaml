apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  name: backend
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    name: http-backend-80
    port: 80
    targetPort: 80
    nodePort: 30800
  type: NodePort
  externalName: backend.kubelab.info
---
apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  creationTimestamp: null
  name: dito-backend
  labels:
    app.kubernetes.io/version: "v1.0.0.$BUILD_NUMBER"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        
      maxUnavailable: 0
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: dito
        tier: backend
    spec:
      containers:
      - env:
        - name: ALLOWED_ORIGIN
          value: "http://$(backend_SERVICE_HOST):3000"
        - name: REDIS_ADDR
          value: "$(REDIS_SERVICE_HOST):6379"
        image: DOCKER_HOST_NAME/dito-backend:v1.0.0.$BUILD_NUMBER
        imagePullPolicy: Always
        name: dito-backend
        ports:
        - containerPort: 3000
        resources: {}
      restartPolicy: Always
      imagePullSecrets:
        - name: registry-auth
status: {}